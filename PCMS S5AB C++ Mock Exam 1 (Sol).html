      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #f59e0b;
      border-radius: 5px;
      padding: 0 5px;

      align-items: center;
      gap: 4px;

      border-radius: 9999px;

      border-radius: 10px;

        margin: 0;

        overflow: visible !important;

        width: 100vw;
        height: 100vh;

        break-after: page;
        display: flex;
        align-items: center;
        justify-content: center;

        max-width: none;
        height: 100%;
        aspect-ratio: auto;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

        progressBar.style.width = `${pct}%`;
      }

      updatePillStrip();
      updateNavigatorActiveState();
    }

    /**
     * Build and refresh bottom quick-jump pills.
     */
    function updatePillStrip() {
      const strip = document.getElementById('bottom-pill-strip');
      if (!strip) return;

      strip.innerHTML = SLIDES.map((s, idx) => {
        const active = idx === currentSlideIndex;
        return `
          <button
            onclick="goToSlide(${idx})"
            title="${s.title}"
            class="px-2 py-0.5 rounded-md text-[11px] font-mono font-bold transition cursor-pointer shrink-0 ${
              active
                ? 'bg-blue-600 text-white shadow-xs'
                : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
            }"
          >
            ${String(idx + 1).padStart(2, '0')}
          </button>
        `;
      }).join('');
    }

    /**
     * Build slide navigator list.
     */
    function buildNavigatorList() {
      const list = document.getElementById('nav-list');
      if (!list) return;

      list.innerHTML = SLIDES.map((s, idx) => `
        <button
          id="nav-item-${idx}"
          onclick="goToSlide(${idx}); toggleNavigator();"
          class="w-full text-left px-3 py-2 rounded-lg border transition flex items-start gap-2.5 cursor-pointer"
        >
          <span class="font-mono text-xs font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 mt-0.5">
            ${String(idx + 1).padStart(2, '0')}
          </span>
          <div class="min-w-0">
            <div class="text-[11px] font-semibold text-blue-600">${s.section}</div>
            <div class="text-xs font-bold text-slate-800 truncate">${s.title}</div>
          </div>
        </button>
      `).join('');

      updateNavigatorActiveState();
    }

    function updateNavigatorActiveState() {
      SLIDES.forEach((_, idx) => {
        const item = document.getElementById(`nav-item-${idx}`);
        if (!item) return;
        if (idx === currentSlideIndex) {
          item.className = 'w-full text-left px-3 py-2 rounded-lg border border-blue-500 bg-blue-50/70 transition flex items-start gap-2.5 cursor-pointer';
        } else {
          item.className = 'w-full text-left px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition flex items-start gap-2.5 cursor-pointer';
        }
      });
    }

    function toggleNavigator() {
      const drawer = document.getElementById('nav-drawer');
      if (!drawer) return;
      drawer.classList.toggle('hidden');
    }

    function closeNavigatorOnBackdrop(event) {
      if (event.target && event.target.id === 'nav-drawer') {
        toggleNavigator();
      }
    }

    function goToSlide(index) {
      if (index < 0) index = 0;
      if (index >= SLIDES.length) index = SLIDES.length - 1;
      currentSlideIndex = index;
      renderActiveSlide();
    }

    function nextSlide() {
      if (currentSlideIndex < SLIDES.length - 1) {
        currentSlideIndex++;
        renderActiveSlide();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderActiveSlide();
      }
    }

    /**
     * Prepare all 16:9 slides for print / PDF export.
     */
    function buildPrintDeck() {
      const printContainer = document.getElementById('all-slides-print');
      if (!printContainer) return;

      printContainer.innerHTML = SLIDES.map((s) => `
        <div class="print-slide-page">
          <div class="slide-16-9">
            ${s.render()}
          </div>
        </div>
      `).join('');

      renderMathInElement(printContainer);
    }

    // Keyboard navigation support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        const drawer = document.getElementById('nav-drawer');
        if (drawer && !drawer.classList.contains('hidden')) return;
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        const drawer = document.getElementById('nav-drawer');
        if (drawer && !drawer.classList.contains('hidden')) return;
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Escape') {
        const drawer = document.getElementById('nav-drawer');
        if (drawer && !drawer.classList.contains('hidden')) {
          toggleNavigator();
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      buildNavigatorList();
      renderActiveSlide();

      // Re-render KaTeX once scripts finish loading if needed
      const checkKatex = setInterval(() => {
        if (typeof window.renderMathInElement === 'function') {
          clearInterval(checkKatex);
          renderActiveSlide();
          buildPrintDeck();
        }
      }, 100);
      setTimeout(() => clearInterval(checkKatex), 4000);
    });
  </script>
</body>
</html>
